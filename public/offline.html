<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0b3d3a" />
    <title>Vssyl — Offline</title>
    <style>
      *, *::before, *::after { box-sizing: border-box; }
      main, section, p { overflow-wrap: anywhere; }
      button { padding: .65rem; margin: .25rem; cursor: pointer; }
      button:disabled { cursor: default; opacity: .65; }
      section { border-top: 1px solid #d4d4d8; padding: .65rem 0; }
      :root {
        color-scheme: light;
        font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif;
      }
      body {
        margin: 0;
        min-height: 100vh;
        background: #fafafa;
        color: #18181b;
        display: grid;
        place-items: center;
        padding: 1.5rem;
      }
      main {
        max-width: 28rem;
        width: 100%;
      }
      h1 {
        font-size: 1.5rem;
        margin: 0 0 0.5rem;
      }
      p {
        margin: 0 0 0.75rem;
        line-height: 1.5;
        color: #3f3f46;
      }
      .status {
        display: inline-block;
        padding: 0.25rem 0.6rem;
        border-radius: 0.375rem;
        background: #e4e4e7;
        font-size: 0.875rem;
        font-weight: 600;
      }
      a {
        color: #18181b;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <main>
      <p class="status">Offline</p>
      <h1>Vssyl</h1>
      <div data-space-offline-fallback><p>Reconnect if this Space was not prepared in this authenticated tab.</p></div>
      <script type="module" src="/space-offline.js"></script>
      <p><a href="/">Try reconnecting</a></p>
    </main>
  </body>
</html>

# Continuous repository verification — does not deploy.
#
# Invokes the same package scripts developers run locally. Database work uses a
# disposable PostgreSQL service database (ltc_ci_*), never ltc_manager.
name: Verify

on:
  pull_request:
  push:
    branches-ignore:
      - main
  workflow_dispatch:

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  AUTH_SECRET: phase5-ci-auth-secret-not-for-production
  SEED_DEMO_PASSWORD: CiSeedPassword!ChangeMe
  ALLOW_DEMO_SEED_PASSWORD: "1"
  TZ: America/New_York

jobs:
  static-hermetic:
    name: Static and hermetic
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install
        run: npm ci

      - name: Test discovery sentinel
        run: npm run verify:discovery

      - name: Migration integrity
        run: npm run verify:migrations

      - name: Repository hygiene
        run: npm run verify:hygiene

      - name: Hermetic tests
        run: npm run test:hermetic

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Prisma validate
        env:
          # Schema declares env() URLs; validate does not connect.
          DATABASE_URL: postgresql://verify:verify@127.0.0.1:5432/ltc_verify_schema_validate?schema=public
          DIRECT_URL: postgresql://verify:verify@127.0.0.1:5432/ltc_verify_schema_validate?schema=public
        run: npx prisma validate

      - name: Production build
        run: npm run verify:build

  database-integration:
    name: Database integration
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ltc_ci
          POSTGRES_PASSWORD: ltc_ci_password
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ltc_ci -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      VERIFY_DATABASE_URL: postgresql://ltc_ci:ltc_ci_password@localhost:5432/ltc_ci_verify?schema=public
      VERIFY_DATABASE_ADMIN_URL: postgresql://ltc_ci:ltc_ci_password@localhost:5432/postgres
      VERIFY_MANAGE_DATABASE: "1"
      MAINTENANCE_DATABASE_URL: postgresql://ltc_ci:ltc_ci_password@localhost:5432/ltc_ci_verify?schema=public
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install
        run: npm ci

      - name: Database safety refuses ltc_manager
        run: |
          set +e
          VERIFY_DATABASE_URL='postgresql://ltc_ci:ltc_ci_password@localhost:5432/ltc_manager?schema=public' \
            npm run verify:db
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            echo "expected ltc_manager to be rejected" >&2
            exit 1
          fi
          echo "ltc_manager correctly rejected"

      - name: verify:db (migrate, seed×2, SQL-backed tests)
        run: npm run verify:db

      - name: Recreate DB for maintenance command
        run: |
          node --input-type=module -e "
          import { recreateDisposableDatabase } from './scripts/verify/admin-database.mjs';
          await recreateDisposableDatabase(process.env.VERIFY_DATABASE_ADMIN_URL, 'ltc_ci_verify');
          "
          DATABASE_URL="$VERIFY_DATABASE_URL" DIRECT_URL="$VERIFY_DATABASE_URL" npx prisma migrate deploy
          DATABASE_URL="$VERIFY_DATABASE_URL" DIRECT_URL="$VERIFY_DATABASE_URL" npx prisma db seed

      - name: Rate-limit cleanup dry-run
        run: npm run maintenance:auth-rate-limits -- --dry-run

      - name: Rate-limit cleanup
        run: npm run maintenance:auth-rate-limits

  offline-browser-gate:
    name: Offline browser gate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ltc_ci
          POSTGRES_PASSWORD: ltc_ci_password
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ltc_ci -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      VERIFY_DATABASE_URL: postgresql://ltc_ci:ltc_ci_password@localhost:5432/ltc_ci_offline_browser?schema=public
      VERIFY_DATABASE_ADMIN_URL: postgresql://ltc_ci:ltc_ci_password@localhost:5432/postgres
      VERIFY_MANAGE_DATABASE: "1"
      OFFLINE_BROWSER_CI_GATE: "1"
      TZ: America/New_York
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install
        run: npm ci

      - name: Install Chromium
        run: npx playwright install chromium --with-deps

      - name: Offline browser certification (CI gate subset)
        run: npm run test:offline-browser

      - name: Upload browser failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: offline-browser-artifacts
          path: tmp/offline-browser-artifacts/
          if-no-files-found: ignore
          retention-days: 7

  assignment-browser-gate:
    name: Assignment browser gate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ltc_ci
          POSTGRES_PASSWORD: ltc_ci_password
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ltc_ci -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      VERIFY_DATABASE_URL: postgresql://ltc_ci:ltc_ci_password@localhost:5432/ltc_ci_assignment_browser?schema=public
      VERIFY_DATABASE_ADMIN_URL: postgresql://ltc_ci:ltc_ci_password@localhost:5432/postgres
      VERIFY_MANAGE_DATABASE: "1"
      TZ: America/New_York
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install
        run: npm ci

      - name: Install Chromium
        run: npx playwright install chromium --with-deps

      - name: Assignment browser certification (CI gate)
        run: npm run test:assignment-browser

      - name: Upload assignment browser failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: assignment-browser-artifacts
          path: tmp/assignment-browser-artifacts/
          if-no-files-found: ignore
          retention-days: 7

Foreground yes
User clamav
LocalSocket /tmp/support-clamd.sock
LocalSocketMode 660
FixStaleSocket yes
DatabaseDirectory /var/lib/clamav
SelfCheck 60
ConcurrentDatabaseReload no
MaxThreads 1
MaxQueue 2
ReadTimeout 30
CommandReadTimeout 10
StreamMaxLength 10M
MaxFileSize 10M
MaxScanSize 50M
MaxFiles 1000
MaxRecursion 8
MaxScanTime 20000
PCREMatchLimit 100000
PCRERecMatchLimit 1000
BytecodeTimeout 10000
HeuristicAlerts yes
AlertExceedsMax yes
AlertEncrypted yes
AlertOLE2Macros yes
ScanArchive yes
ScanOLE2 yes
ScanPDF yes
ScanXMLDOCS yes
